name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK with git SHA
        run: |
          SHA=$(git rev-parse --short HEAD)
          cp android/app/build/outputs/apk/debug/app-debug.apk math-racers-${SHA}.apk
          echo "APK_NAME=math-racers-${SHA}.apk" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: math-racers-debug
          path: ${{ env.APK_NAME }}

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Math Racers APK (Latest)"
          body: "Auto-built Android APK — build `${{ github.sha }}`.\n\nThis is a WebView wrapper that loads the live site — it auto-updates when new web code is deployed."
          files: ${{ env.APK_NAME }}
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
