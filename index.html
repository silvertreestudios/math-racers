<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Math Racers</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      touch-action: none;
      /* Account for notches/safe areas */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      /* Use dvh (dynamic viewport height) where supported, fallback to innerHeight via JS */
      width: 100vw;
      height: 100dvh;
      height: 100vh; /* fallback for older browsers, overridden by JS */
    }
    canvas {
      display: block;
      touch-action: none;
    }

    /* Portrait overlay — shown when device is in portrait */
    #rotate-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #1a1a2e;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-family: Arial Black, Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }
    #rotate-overlay .rotate-icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: wiggle 1.5s ease-in-out infinite;
    }
    #rotate-overlay .rotate-text {
      font-size: 24px;
      line-height: 1.4;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
    }

    /* Show overlay in portrait mode */
    @media (orientation: portrait) {
      #rotate-overlay {
        display: flex !important;
      }
      #game-container {
        display: none;
      }
    }
    @media (orientation: landscape) {
      #rotate-overlay {
        display: none !important;
      }
      #game-container {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div id="rotate-overlay">
    <div class="rotate-icon">📱↔️</div>
    <div class="rotate-text">Please rotate your device<br>to landscape mode</div>
  </div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
  <script>
    // Fix mobile viewport: 100vh includes browser chrome, window.innerHeight doesn't
    function setRealViewport() {
      const container = document.getElementById('game-container');
      container.style.height = window.innerHeight + 'px';
      container.style.width = window.innerWidth + 'px';
    }
    setRealViewport();
    window.addEventListener('resize', setRealViewport);
    window.addEventListener('orientationchange', () => setTimeout(setRealViewport, 100));

    // Try to lock orientation to landscape
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }
  </script>
</body>
</html>
