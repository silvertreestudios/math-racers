<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Math Racers — Visual Car Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1e; font-family: Arial, sans-serif; color: #fff; }

    /* ── Index page (no params) ────────────────────────────── */
    #index-page { display: none; padding: 24px; }
    #index-page h1 { color: #ffdd00; margin-bottom: 6px; }
    #index-page p  { color: #8888aa; font-size: 13px; margin-bottom: 20px; }
    .class-section { margin-bottom: 24px; }
    .class-section h2 { color: #88aaff; font-size: 15px; margin-bottom: 8px; border-bottom: 1px solid #334; padding-bottom: 4px; }
    .link-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .link-grid a {
      display: inline-block; padding: 5px 10px; background: #1a1a2e;
      border: 1px solid #334466; border-radius: 4px; color: #ccccff;
      text-decoration: none; font-size: 12px; white-space: nowrap;
    }
    .link-grid a:hover { background: #2a2a4e; color: #fff; }
    .link-grid a.bare { color: #ffdd88; border-color: #554422; }

    /* ── Single-render page (with params) ─────────────────── */
    #render-page { display: none; }
    #game-container { display: block; }
  </style>
</head>
<body>
  <div id="index-page">
    <h1>🏎️ Math Racers — Car &amp; Attachment Viewer</h1>
    <p>256×256 isolated render per car+attachment combo. 55 total (5 classes × 11 each).<br>
       Use <code>?class=addition&amp;attachment=crown</code> or <code>?attachment=bare</code> for no attachment.</p>
    <div id="class-sections"></div>
  </div>
  <div id="render-page">
    <div id="game-container"></div>
  </div>

  <script type="module">
    import Phaser from 'phaser';
    import { CAR_DRAW_FN } from '../src/systems/CarRenderer.js';
    import { ATTACHMENTS_BY_CLASS } from '../src/config/attachments.js';
    import { CAR_COLORS_BY_CLASS } from '../src/config/cars.js';

    const CLASS_ORDER = ['addition', 'subtraction', 'multiplication', 'division', 'advanced'];
    const CLASS_LABELS = {
      addition:       'Go-Kart (Addition)',
      subtraction:    'Rally Car (Subtraction)',
      multiplication: 'Monster Truck (Multiplication)',
      division:       'Formula 1 (Division)',
      advanced:       'Supercar (Advanced)',
    };

    const params = new URLSearchParams(location.search);
    const paramClass = params.get('class');
    const paramAtt   = params.get('attachment');

    // ── Index mode (no params) ──────────────────────────────────────────────
    if (!paramClass && !paramAtt) {
      document.getElementById('index-page').style.display = 'block';
      const sectionsEl = document.getElementById('class-sections');

      for (const classId of CLASS_ORDER) {
        const attachments = ATTACHMENTS_BY_CLASS[classId] || [];
        const section = document.createElement('div');
        section.className = 'class-section';
        section.innerHTML = `<h2>${CLASS_LABELS[classId]}</h2>`;
        const grid = document.createElement('div');
        grid.className = 'link-grid';

        // bare link
        const bareA = document.createElement('a');
        bareA.className = 'bare';
        bareA.href = `?class=${classId}&attachment=bare`;
        bareA.textContent = '🚗 bare';
        grid.appendChild(bareA);

        for (const att of attachments) {
          const a = document.createElement('a');
          a.href = `?class=${classId}&attachment=${att.id}`;
          a.textContent = `${att.emoji} ${att.id}`;
          grid.appendChild(a);
        }

        section.appendChild(grid);
        sectionsEl.appendChild(section);
      }

    // ── Single render mode (with params) ───────────────────────────────────
    } else {
      document.getElementById('render-page').style.display = 'block';

      const SIZE  = 256;
      const SCALE = 4;

      class SingleScene extends Phaser.Scene {
        constructor() { super({ key: 'SingleScene' }); }

        create() {
          const classId    = paramClass ?? 'addition';
          const attId      = paramAtt   ?? 'bare';
          const drawFn     = CAR_DRAW_FN[classId];
          const color      = CAR_COLORS_BY_CLASS[classId]?.[0] ?? 0x00cccc;
          const attachments = ATTACHMENTS_BY_CLASS[classId] ?? [];
          const attachment = attId === 'bare' ? null : attachments.find(a => a.id === attId) ?? null;

          if (!drawFn) {
            this.add.text(SIZE / 2, SIZE / 2, `Unknown class:\n"${classId}"`, {
              fontSize: '14px', color: '#ff4444', align: 'center',
            }).setOrigin(0.5);
            return;
          }

          if (attId !== 'bare' && !attachment) {
            this.add.text(SIZE / 2, SIZE / 2, `Unknown attachment:\n"${attId}"`, {
              fontSize: '14px', color: '#ff4444', align: 'center',
            }).setOrigin(0.5);
            return;
          }

          // Draw car + attachment in a scaled container centered in canvas
          const container = this.add.container(SIZE / 2, SIZE / 2);
          const gfx = this.add.graphics();

          try { drawFn(gfx, color, true); } catch (e) { console.error('car draw error', e); }
          if (attachment) {
            try { attachment.draw(gfx, color); } catch (e) { console.error('attachment draw error', e); }
          }

          container.add(gfx);
          container.setScale(SCALE);
        }
      }

      new Phaser.Game({
        type: Phaser.CANVAS,
        width:  SIZE,
        height: SIZE,
        backgroundColor: '#1a1a2e',
        parent: 'game-container',
        audio:  { noAudio: true },
        input:  { mouse: false, touch: false, keyboard: false },
        scene:  [SingleScene],
      });
    }
  </script>
</body>
</html>
